services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.3.7
    container_name: mcp-demo-clickhouse
    environment:
      # Demo only: let the default user connect without a password,
      # like the standalone binary started by scripts/clickhouse.sh.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, used by mcp-clickhouse
      - "127.0.0.1:9000:9000"   # native protocol, used in bug 04
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
